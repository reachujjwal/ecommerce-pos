services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3301:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_db
    volumes:
      - mysql-data:/var/lib/mysql
      
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 10s
      retries: 10
      interval: 10s
      start_period: 10s
    networks:
      - ujjwal  

  retailhub:
    build: ./ecommerce-backend
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: ecommerce_db
      DB_USERNAME: root
      DB_PASSWORD: root
    networks:
      - ujjwal

  pos-frontend:
    build: ./ecommerce-frontend
    depends_on:
      - retailhub
    ports:
      - "8080:80"
    networks:
      - ujjwal

networks:
  ujjwal:

volumes:
  mysql-data:  
